---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: nodeimages.liquid.k0sproject.io
spec:
  group: liquid.k0sproject.io
  names:
    kind: NodeImage
    listKind: NodeImageList
    plural: nodeimages
    shortNames:
    - nimg
    singular: nodeimage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.digest
      name: Digest
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeImage declares an immutable bootc deployment for selected
          nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeImageSpec selects nodes and the digest-pinned bootc image
              to deploy.
            properties:
              digest:
                description: Digest is an OCI image reference pinned with an sha256
                  digest.
                pattern: ^.+@sha256:[a-f0-9]{64}$
                type: string
              selector:
                description: Selector is evaluated once when the plan starts.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              strategy:
                description: NodeImageStrategy controls readiness and rollback behavior.
                properties:
                  automaticRollback:
                    default: true
                    description: AutomaticRollback rolls a node back after the readiness
                      deadline.
                    type: boolean
                  deadline:
                    default: 10m
                    description: Deadline is the maximum time a rebooted node may
                      remain unready.
                    type: string
                type: object
            required:
            - digest
            - selector
            type: object
          status:
            description: NodeImageStatus records the immutable target list and rollout
              progress.
            properties:
              message:
                type: string
              observedDigest:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              targets:
                items:
                  description: NodeImageTargetStatus records one node's image transition.
                  properties:
                    finishedAt:
                      format: date-time
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    previousDigest:
                      type: string
                    role:
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                    state:
                      type: string
                  required:
                  - name
                  - role
                  - state
                  type: object
                type: array
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
