apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: admissionpolicies.liquid.k0sproject.io
spec:
  group: liquid.k0sproject.io
  scope: Namespaced
  names:
    plural: admissionpolicies
    singular: admissionpolicy
    kind: AdmissionPolicy
    shortNames: [admissionpolicy]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              mode:
                enum: ["off", attestation, attestation+log]
                type: string
              issuers:
                type: array
                items: {type: string}
              profiles:
                type: array
                items: {type: string}
              exempt:
                type: array
                items: {type: string}
              failurePolicy:
                enum: [Fail]
                type: string
              attestationStore:
                type: string
              log:
                type: object
                properties:
                  mode:
                    enum: [deny, verify]
                    type: string
                  lake:
                    type: string
                  trust:
                    type: object
                    properties:
                      identity:
                        type: object
                        properties:
                          taapID:
                            type: string
                          publicKey:
                            type: string
                        required: [taapID, publicKey]
                      witnessThreshold:
                        type: integer
                      witnesses:
                        type: array
                        items:
                          type: object
                          properties:
                            endpoint:
                              type: string
                            publicKey:
                              type: string
                          required: [endpoint, publicKey]
                    required: [identity, witnessThreshold]
                  maximumCheckpointAgeSeconds:
                    minimum: 0
                    type: integer
                required: [mode]
            required: [mode, failurePolicy]
