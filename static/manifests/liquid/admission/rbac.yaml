apiVersion: v1
kind: ServiceAccount
metadata:
  name: liquid-admission
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k0s-liquid-admission
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k0s-liquid-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k0s-liquid-admission
subjects:
- kind: ServiceAccount
  name: liquid-admission
  namespace: kube-system
