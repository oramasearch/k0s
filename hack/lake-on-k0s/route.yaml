apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: lake-on-k0s
  namespace: liquid-system
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: lake-on-k0s
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: lake-on-k0s
    namespace: liquid-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lake-on-k0s
  namespace: liquid-system
spec:
  gatewayClassName: lake-on-k0s
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lake-hello
  namespace: lake-dev
spec:
  parentRefs:
    - name: lake-on-k0s
      namespace: liquid-system
  rules:
    - backendRefs:
        - name: lake-hello
          port: 80
